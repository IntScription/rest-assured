name: Deploy Web to Kubernetes

on:
  workflow_run:
    workflows: ["Publish Web Docker Image"]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set lowercase repository owner
        run: echo "OWNER_LC=${OWNER,,}" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Verify kubectl access
        run: kubectl get nodes

      - name: Apply manifests
        run: |
          kubectl apply -f infra/kubernetes/deployment.yml
          kubectl apply -f infra/kubernetes/service.yml

      - name: Update deployment image
        run: |
          kubectl set image deployment/gravity-log-web \
            gravity-log-web=ghcr.io/${OWNER_LC}/gravity-log-web:latest

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/gravity-log-web
